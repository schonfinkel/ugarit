name: "[Nix] Build and Test"

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    name: "[Nix] Build and Test"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      # zig2nix uses bubblewrap while building its Zig helper.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'build.zig', 'build.zig.zon', 'build.zig.zon2json-lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build default package
        run: nix build .#default --no-link --print-build-logs

      - name: Build static package
        run: nix build .#static --no-link --print-build-logs
